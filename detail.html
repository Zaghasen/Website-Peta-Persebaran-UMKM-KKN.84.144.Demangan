        .btn-back:hover {

        .header-section {

            line-height: 1;

        const urlParams = new URLSearchParams(window.location.search);
        const umkmId = urlParams.get('id');

        // Tampilkan Data ke Halaman
        if (umkmId && databaseUMKM[umkmId]) {
            const data = databaseUMKM[umkmId];

            // Update title tag
            document.title = `${data.name} — UMKM Dusun Demangan`;

            document.getElementById('title').innerText = data.name;

            // Badge kategori berwarna
            const catMap = {
                'Kuliner dan Makanan Olahan': 'kuliner',
                'Toko Kelontong dan Lainnya': 'kelontong',
                'Jasa dan Persewaan': 'jasa',
                'Fashion dan Kerajinan': 'fashion'
            };
            const catClass = catMap[data.category] || '';
            document.getElementById('meta').innerHTML =
                `<span class="cat-badge ${catClass}">${data.category}</span><br>
                 <span style="font-size:0.85rem;color:#7a8c7e;font-weight:400;">${data.location} &nbsp;•&nbsp; Pemilik: ${data.owner}</span>`;
            document.getElementById('story').innerText = data.story;
            document.getElementById('waLink').href = data.wa;
            document.getElementById('mapsLink').href = data.maps;

            // Galeri Foto
            const gallerySection = document.getElementById('gallerySection');
            const galleryScroll = document.getElementById('galleryScroll');
            galleryScroll.innerHTML = '';
            if (data.photos && data.photos.length > 0 && data.photoDir) {
                gallerySection.style.display = '';
                let lightboxPhotos = [];
                let lightboxIndex = 0;
                data.photos.forEach((fname, idx) => {
                    const src = `assets/UMKM/${data.photoDir}/${fname}`;
                    lightboxPhotos.push(src);
                    const img = document.createElement('img');
                    img.className = 'gallery-img';
                    img.src = src;
                    img.alt = `Foto ${data.name} ${idx + 1}`;
                    img.loading = 'lazy';
                    img.addEventListener('click', () => openLightbox(lightboxPhotos, idx));
                    galleryScroll.appendChild(img);
                });

                // Lightbox logic
                const lb = document.getElementById('lightbox');
                const lbImg = document.getElementById('lightboxImg');
                const lbCounter = document.getElementById('lightboxCounter');
                function openLightbox(photos, index) {
                    lightboxPhotos = photos;
                    lightboxIndex = index;
                    lbImg.src = photos[index];
                    lbCounter.textContent = `${index + 1} / ${photos.length}`;
                    lb.classList.add('active');
                }
                document.getElementById('lightboxClose').onclick = () => lb.classList.remove('active');
                document.getElementById('lightboxNext').onclick = () => {
                    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
                    lbImg.src = lightboxPhotos[lightboxIndex];
                    lbCounter.textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
                };
                document.getElementById('lightboxPrev').onclick = () => {
                    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
                    lbImg.src = lightboxPhotos[lightboxIndex];
                    lbCounter.textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
                };
                lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('active'); });
                document.addEventListener('keydown', (e) => {
                    if (!lb.classList.contains('active')) return;
                    if (e.key === 'Escape') lb.classList.remove('active');
                    if (e.key === 'ArrowRight') document.getElementById('lightboxNext').click();
                    if (e.key === 'ArrowLeft') document.getElementById('lightboxPrev').click();
                });
            } else {
                gallerySection.style.display = 'none';
            }

            const catalogBox = document.getElementById('catalog');
            catalogBox.innerHTML = '';
            data.catalog.forEach(item => {
                catalogBox.innerHTML += `
                    <div class="catalog-item">
                        <span>${item.name}</span>
                        <span class="price">${item.price}</span>
                    </div>
                `;
            });
        } else {
            document.querySelector('.container').innerHTML = `
                <h2 style="color:#004025; margin-bottom:12px;">Data UMKM tidak ditemukan.</h2>
                <p style="color:#7a8c7e; margin-bottom:20px;">UMKM dengan ID "<strong>${umkmId || '-'}</strong>" belum tersedia di database.</p>
                <a href="index.html" style="color:#1DB233; font-weight:600; text-decoration:none;">← Kembali ke Peta</a>
            `;
        }
